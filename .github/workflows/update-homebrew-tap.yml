name: Update Homebrew Tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.1)"
        required: true
  workflow_call:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.1)"
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag and version
        id: ver
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download source tarball and compute sha256
        id: sha
        run: |
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/${{ steps.ver.outputs.tag }}.tar.gz"
          curl -fsSL -o src.tar.gz "$URL"
          SHA=$(sha256sum src.tar.gz | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: yannickpulver/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Write formula
        run: |
          cat > tap/Formula/make-android-keystore.rb <<EOF
          class MakeAndroidKeystore < Formula
            desc "Generate Android signing keystores with 1Password-managed passwords"
            homepage "https://github.com/yannickpulver/make-android-keystore"
            url "https://github.com/yannickpulver/make-android-keystore/archive/refs/tags/${{ steps.ver.outputs.tag }}.tar.gz"
            sha256 "${{ steps.sha.outputs.sha256 }}"
            license "MIT"

            depends_on "jq"

            def install
              bin.install "make-android-keystore"
            end

            def caveats
              <<~CAVEATS
                Also requires at runtime:
                  - a JDK (keytool)
                  - the 1Password CLI, signed in: brew install 1password-cli
              CAVEATS
            end

            test do
              assert_match "Usage", shell_output("#{bin}/make-android-keystore 2>&1", 1)
            end
          end
          EOF

      - name: Commit and push
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/make-android-keystore.rb
          git diff --cached --quiet && exit 0
          git commit -m "make-android-keystore ${{ steps.ver.outputs.version }}"
          git push
